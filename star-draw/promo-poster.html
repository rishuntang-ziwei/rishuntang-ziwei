<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>先知斗數神牌 · 實體卡組｜日舜堂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0b0608;
      --blood: #6e1218;
      --crimson: #9c1c24;
      --gold: #d4b56a;
      --gold-bright: #f0d9a0;
      --paper: #f4e8d4;
      --smoke: rgba(244, 232, 212, 0.72);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--ink);
      color: var(--paper);
      font-family: "Noto Serif TC", "Songti TC", serif;
    }

    body {
      overflow-x: hidden;
    }

    .poster {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(20px, 4vw, 48px);
      isolation: isolate;
      overflow: hidden;
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 80% 55% at 50% 18%, rgba(156, 28, 36, 0.55), transparent 62%),
        radial-gradient(ellipse 70% 50% at 80% 90%, rgba(110, 18, 24, 0.45), transparent 55%),
        radial-gradient(ellipse 55% 40% at 10% 75%, rgba(212, 181, 106, 0.12), transparent 50%),
        linear-gradient(165deg, #14080a 0%, #0b0608 45%, #1a0a0c 100%);
    }

    .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0.18;
      background-image:
        url("../assets/bg-calligraphy.png"),
        repeating-linear-gradient(
          -18deg,
          transparent 0 11px,
          rgba(212, 181, 106, 0.04) 11px 12px
        );
      background-size: cover, auto;
      background-position: center;
      mix-blend-mode: soft-light;
      animation: grainDrift 18s linear infinite;
    }

    @keyframes grainDrift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-2%, 1.5%, 0); }
    }

    .frame {
      width: min(100%, 720px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(18px, 3.5vh, 28px);
      text-align: center;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: riseIn 1s ease 0.15s forwards;
    }

    .brand img {
      width: clamp(72px, 16vw, 96px);
      height: auto;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.45));
    }

    .brand-mark {
      font-family: "Cormorant Garamond", "Noto Serif TC", serif;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      font-size: clamp(0.78rem, 2.2vw, 0.95rem);
      color: var(--gold);
      text-transform: uppercase;
    }

    .product-name {
      font-weight: 900;
      font-size: clamp(2.05rem, 8.2vw, 3.55rem);
      letter-spacing: 0.12em;
      line-height: 1.15;
      color: var(--paper);
      text-shadow: 0 2px 24px rgba(156, 28, 36, 0.45);
      opacity: 0;
      animation: riseIn 1s ease 0.35s forwards;
    }

    .lede {
      max-width: 28em;
      font-size: clamp(0.98rem, 2.8vw, 1.15rem);
      line-height: 1.75;
      color: var(--smoke);
      letter-spacing: 0.04em;
      opacity: 0;
      animation: riseIn 1s ease 0.55s forwards;
    }

    .fan {
      position: relative;
      width: min(100%, 560px);
      height: clamp(280px, 52vw, 390px);
      margin: 4px 0 8px;
      opacity: 0;
      animation: riseIn 1.1s ease 0.7s forwards;
    }

    .fan img {
      position: absolute;
      left: 50%;
      bottom: 8%;
      width: clamp(118px, 28vw, 168px);
      aspect-ratio: 2 / 3.1;
      object-fit: cover;
      border-radius: 10px;
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(212, 181, 106, 0.22);
      transform-origin: 50% 110%;
      will-change: transform;
    }

    .fan img:nth-child(1) {
      transform: translateX(-128%) rotate(-20deg) translateY(22px);
      animation: cardSettle1 1.35s cubic-bezier(0.22, 1, 0.36, 1) 0.85s both;
      z-index: 1;
    }
    .fan img:nth-child(2) {
      transform: translateX(-88%) rotate(-10deg) translateY(8px);
      animation: cardSettle2 1.35s cubic-bezier(0.22, 1, 0.36, 1) 0.95s both;
      z-index: 2;
    }
    .fan img:nth-child(3) {
      transform: translateX(-50%) rotate(0deg) translateY(-12px) scale(1.08);
      animation: cardSettle3 1.4s cubic-bezier(0.22, 1, 0.36, 1) 1.05s both,
                 floatHero 4.8s ease-in-out 2.5s infinite;
      z-index: 5;
    }
    .fan img:nth-child(4) {
      transform: translateX(-12%) rotate(10deg) translateY(8px);
      animation: cardSettle4 1.35s cubic-bezier(0.22, 1, 0.36, 1) 1.15s both;
      z-index: 3;
    }
    .fan img:nth-child(5) {
      transform: translateX(28%) rotate(20deg) translateY(22px);
      animation: cardSettle5 1.35s cubic-bezier(0.22, 1, 0.36, 1) 1.25s both;
      z-index: 1;
    }

    @keyframes cardSettle1 {
      from { opacity: 0; transform: translateX(-50%) rotate(0deg) translateY(80px) scale(0.85); }
      to { opacity: 1; transform: translateX(-128%) rotate(-20deg) translateY(22px); }
    }
    @keyframes cardSettle2 {
      from { opacity: 0; transform: translateX(-50%) rotate(0deg) translateY(80px) scale(0.85); }
      to { opacity: 1; transform: translateX(-88%) rotate(-10deg) translateY(8px); }
    }
    @keyframes cardSettle3 {
      from { opacity: 0; transform: translateX(-50%) rotate(0deg) translateY(90px) scale(0.8); }
      to { opacity: 1; transform: translateX(-50%) rotate(0deg) translateY(-12px) scale(1.08); }
    }
    @keyframes cardSettle4 {
      from { opacity: 0; transform: translateX(-50%) rotate(0deg) translateY(80px) scale(0.85); }
      to { opacity: 1; transform: translateX(-12%) rotate(10deg) translateY(8px); }
    }
    @keyframes cardSettle5 {
      from { opacity: 0; transform: translateX(-50%) rotate(0deg) translateY(80px) scale(0.85); }
      to { opacity: 1; transform: translateX(28%) rotate(20deg) translateY(22px); }
    }

    @keyframes floatHero {
      0%, 100% { transform: translateX(-50%) rotate(0deg) translateY(-12px) scale(1.08); }
      50% { transform: translateX(-50%) rotate(-1.2deg) translateY(-20px) scale(1.1); }
    }

    .offer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: riseIn 1s ease 1.35s forwards;
    }

    .price-label {
      font-family: "Cormorant Garamond", serif;
      font-size: 0.95rem;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      color: var(--gold);
      text-transform: uppercase;
    }

    .price {
      font-weight: 900;
      font-size: clamp(2.6rem, 11vw, 4rem);
      letter-spacing: 0.08em;
      line-height: 1;
      color: var(--gold-bright);
      text-shadow: 0 0 28px rgba(212, 181, 106, 0.28);
      animation: priceGlow 3.2s ease-in-out 2s infinite;
    }

    .price span {
      font-size: 0.42em;
      margin-right: 0.18em;
      letter-spacing: 0.04em;
      vertical-align: 0.45em;
      opacity: 0.85;
    }

    .includes {
      margin-top: 4px;
      padding: 10px 18px;
      border: 1px solid rgba(212, 181, 106, 0.35);
      background: linear-gradient(180deg, rgba(156, 28, 36, 0.28), rgba(11, 6, 8, 0.35));
      font-size: clamp(0.95rem, 2.6vw, 1.05rem);
      letter-spacing: 0.12em;
      color: var(--paper);
    }

    .cta {
      margin-top: 4px;
      opacity: 0;
      animation: riseIn 1s ease 1.55s forwards;
    }

    .cta a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 12em;
      padding: 14px 28px;
      border: 1px solid var(--gold);
      background: linear-gradient(180deg, #b42830 0%, #6e1218 100%);
      color: var(--paper);
      text-decoration: none;
      letter-spacing: 0.22em;
      text-indent: 0.22em;
      font-size: 1rem;
      font-weight: 700;
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
      box-shadow: 0 10px 28px rgba(110, 18, 24, 0.45);
    }

    .cta a:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
      box-shadow: 0 14px 32px rgba(156, 28, 36, 0.55);
    }

    .foot {
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: rgba(244, 232, 212, 0.45);
      opacity: 0;
      animation: riseIn 1s ease 1.7s forwards;
    }

    .sweep {
      pointer-events: none;
      position: absolute;
      inset: -20% -40%;
      background: linear-gradient(
        115deg,
        transparent 40%,
        rgba(240, 217, 160, 0.08) 48%,
        rgba(240, 217, 160, 0.18) 50%,
        rgba(240, 217, 160, 0.08) 52%,
        transparent 60%
      );
      transform: translateX(-30%);
      animation: sweep 5.5s ease-in-out 2.2s infinite;
      z-index: 0;
    }

    .frame > * { position: relative; z-index: 1; }

    @keyframes sweep {
      0%, 100% { transform: translateX(-35%); opacity: 0; }
      15% { opacity: 1; }
      55% { transform: translateX(35%); opacity: 0.9; }
      70%, 100% { opacity: 0; }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes priceGlow {
      0%, 100% { text-shadow: 0 0 22px rgba(212, 181, 106, 0.22); }
      50% { text-shadow: 0 0 36px rgba(240, 217, 160, 0.42); }
    }

    @media (max-width: 420px) {
      .fan {
        height: 300px;
      }
      .fan img {
        width: 112px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .brand, .product-name, .lede, .fan, .offer, .cta, .foot { opacity: 1; }
      .fan img { opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="先知斗數神牌實體卡組宣傳">
    <div class="sweep" aria-hidden="true"></div>
    <div class="frame">
      <div class="brand">
        <img src="../bracelet-card/assets/rishuntang-logo.png" alt="日舜堂" />
        <p class="brand-mark">Rishuntang</p>
      </div>

      <h1 class="product-name">先知斗數神牌</h1>
      <p class="lede">實體卡組正式販售。以主星牌面為引，帶你辨識星曜能量與牌義結構。</p>

      <div class="fan" aria-hidden="true">
        <img src="assets/cards/major/qi-sha.png" alt="" />
        <img src="assets/cards/major/tai-yang.png" alt="" />
        <img src="assets/cards/major/zi-wei.png" alt="" />
        <img src="assets/cards/major/wu-qu.png" alt="" />
        <img src="assets/ui/card-back.png" alt="" />
      </div>

      <div class="offer">
        <p class="price-label">Physical Deck Set</p>
        <p class="price"><span>NT$</span>8,888</p>
        <p class="includes">含卡牌識別課程</p>
      </div>

      <div class="cta">
        <a href="../chart.html">了解更多</a>
      </div>

      <p class="foot">國際日舜堂 · 紫微斗數</p>
    </div>
  </main>
</body>
</html>
